name: Bonsai 2 PTQ1 matvec-many

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/test_bonsai2_ptq1_many.c
      - qwen38/bonsai2_quant_dot_avx2.c
      - .github/workflows/bonsai2-ptq1-many.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ptq1-many:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile PTQ1 matvec-many gate
        shell: bash
        run: |
          set -euxo pipefail
          gcc -O3 -std=c11 -mavx2 -mfma \
            -Werror=implicit-function-declaration \
            qwen38/test_bonsai2_ptq1_many.c -lm \
            -o /tmp/bonsai2-ptq1-many
      - name: Run bitwise gate and same-run benchmarks
        shell: bash
        run: /tmp/bonsai2-ptq1-many
