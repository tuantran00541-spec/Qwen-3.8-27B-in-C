name: Bonsai 2 native GDN vector gate

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/test_bonsai2_native_gdn_vectors.py
      - qwen38/bonsai2_quant_runtime.py
      - qwen38/bonsai2_quant_dot_avx2.c
      - qwen38/bonsai2_persistent_pool_portable.c
      - .github/workflows/bonsai2-gdn-vectors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gdn-vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/gdn-vectors
          gcc -O3 -std=c11 -mavx2 -mfma -fPIC -shared \
            qwen38/bonsai2_persistent_pool_portable.c \
            -pthread -lm \
            -o work/gdn-vectors/libbonsai2_quant.so
      - name: Run native GDN vector bitwise gate
        shell: bash
        run: |
          set -euxo pipefail
          python qwen38/test_bonsai2_native_gdn_vectors.py \
            --native-lib work/gdn-vectors/libbonsai2_quant.so
