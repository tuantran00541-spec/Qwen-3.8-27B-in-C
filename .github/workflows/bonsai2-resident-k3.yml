name: Bonsai 2 resident K3 behavior

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/test_bonsai2_resident_k3.py
      - qwen38/bonsai2_prompt_spike.py
      - qwen38/k3_stream.py
      - .github/workflows/bonsai2-resident-k3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resident-behavior:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tokenizer dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check tokenizers
      - name: Run resident K3 behavior gate
        shell: bash
        run: |
          set -euxo pipefail
          python qwen38/test_bonsai2_resident_k3.py
