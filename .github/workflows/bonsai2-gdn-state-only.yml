name: Bonsai 2 tiny attention tail sweep

on:
  push:
    branches:
      - experiment/bonsai2-gdn-state-only
    paths:
      - qwen38/bonsai2_prompt_spike.py
      - .github/workflows/bonsai2-gdn-state-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-probe:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tail: [0, 1, 2, 4, 8, 16, 32, 64]
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build native runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/tail-${{ matrix.tail }}
          gcc -O3 -std=c11 -mavx2 -mfma -fPIC -shared \
            qwen38/bonsai2_persistent_pool_portable.c \
            -pthread -lm \
            -o work/tail-${{ matrix.tail }}/libbonsai2_quant.so
          gcc -O3 -std=c11 -fPIC -shared \
            qwen38/gdn_state_ar_portable_pool.c \
            -pthread -lm \
            -o work/tail-${{ matrix.tail }}/libgdn_state.so
          python -m pip install --disable-pip-version-check tokenizers
          python -m py_compile qwen38/bonsai2_prompt_spike.py

      - name: Download pinned model and tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p models/bonsai2 models/qwen-official
          MODEL="models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf"
          MODEL_URL="https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/6ed5e12bf84b7a63069882c91dd9e9218647d17b/Ternary-Bonsai-2-27B-PTQ1_0.gguf?download=true"
          MODEL_SHA="53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3"
          curl -fL --retry 10 --retry-all-errors -C - -o "$MODEL.part" "$MODEL_URL"
          echo "$MODEL_SHA  $MODEL.part" | sha256sum -c -
          mv "$MODEL.part" "$MODEL"

          TOKENIZER="models/qwen-official/tokenizer.json"
          TOKENIZER_URL="https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/tokenizer.json?download=true"
          TOKENIZER_SHA="0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3"
          curl -fL --retry 10 --retry-all-errors -o "$TOKENIZER.part" "$TOKENIZER_URL"
          echo "$TOKENIZER_SHA  $TOKENIZER.part" | sha256sum -c -
          mv "$TOKENIZER.part" "$TOKENIZER"

      - name: Run context retention probe
        shell: bash
        run: |
          set -euxo pipefail
          TAIL="${{ matrix.tail }}"
          PROMPT='Memorize these two facts: codeword is MARBLE-731; 6 boxes times 4 pens minus 7 pens equals 17. Output exactly two lines and nothing else. Line 1: Codeword: MARBLE-731. Line 2: Result: 17 pens.'
          EXTRA=()
          if [ "$TAIL" -gt 0 ]; then
            EXTRA=(--attention-tail-tokens "$TAIL")
          fi

          mkdir -p "work/tail-$TAIL/k3"
          python qwen38/bonsai2_prompt_spike.py \
            --model models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
            --native-lib "work/tail-$TAIL/libbonsai2_quant.so" \
            --state-lib "work/tail-$TAIL/libgdn_state.so" \
            --tokenizer-json models/qwen-official/tokenizer.json \
            --prompt "$PROMPT" \
            --max-new-tokens 32 \
            --threads 4 \
            --resident-decoder \
            --no-json-events \
            "${EXTRA[@]}" \
            --work-dir "work/tail-$TAIL/k3" \
            --output "work/tail-$TAIL/result.json"

      - name: Print retention summary
        shell: bash
        run: |
          set -euxo pipefail
          TAIL="${{ matrix.tail }}"
          python - "$TAIL" <<'PY'
          import json
          import sys
          from pathlib import Path

          tail = int(sys.argv[1])
          p = Path(f"work/tail-{tail}/result.json")
          d = json.loads(p.read_text())
          generated = d["generated_text"]
          report = {
              "tail_tokens": None if tail == 0 else tail,
              "baseline": tail == 0,
              "generated_text": generated,
              "retained_codeword": "MARBLE-731" in generated,
              "retained_arithmetic": "17" in generated,
              "stop_reason": d["stop_reason"],
              "prompt_attention_rows_dropped": d["dropped_prompt_attention_rows"],
              "attention_kv_bytes_end": d["state"]["attention_kv_bytes_f16"],
              "tokens_per_second": d["timing"]["tokens_per_second"],
              "max_rss_gib": d["max_rss_gib"],
          }
          out = Path(f"work/tail-{tail}/summary.json")
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False) + "\n")
          print("TAIL_SWEEP_RESULT=" + json.dumps(report, ensure_ascii=False))
          PY

      - name: Drop large files
        if: always()
        shell: bash
        run: |
          rm -rf models/bonsai2 models/qwen-official
          rm -f work/tail-${{ matrix.tail }}/k3/decoder64.k3.bin

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-tail-${{ matrix.tail }}
          path: |
            work/tail-${{ matrix.tail }}/result.json
            work/tail-${{ matrix.tail }}/summary.json
          if-no-files-found: warn
          retention-days: 30
