name: Bonsai 2 GDN state-only context probe

on:
  push:
    branches:
      - experiment/bonsai2-gdn-state-only
    paths:
      - qwen38/bonsai2_prompt_spike.py
      - .github/workflows/bonsai2-gdn-state-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build native runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/context-probe
          gcc -O3 -std=c11 -mavx2 -mfma -fPIC -shared             qwen38/bonsai2_persistent_pool_portable.c             -pthread -lm             -o work/context-probe/libbonsai2_quant.so
          gcc -O3 -std=c11 -fPIC -shared             qwen38/gdn_state_ar_portable_pool.c             -pthread -lm             -o work/context-probe/libgdn_state.so
          python -m pip install --disable-pip-version-check tokenizers
          python -m py_compile qwen38/bonsai2_prompt_spike.py

      - name: Download pinned model and tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p models/bonsai2 models/qwen-official
          MODEL="models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf"
          MODEL_URL="https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/6ed5e12bf84b7a63069882c91dd9e9218647d17b/Ternary-Bonsai-2-27B-PTQ1_0.gguf?download=true"
          MODEL_SHA="53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3"
          curl -fL --retry 10 --retry-all-errors -C - -o "$MODEL.part" "$MODEL_URL"
          echo "$MODEL_SHA  $MODEL.part" | sha256sum -c -
          mv "$MODEL.part" "$MODEL"

          TOKENIZER="models/qwen-official/tokenizer.json"
          TOKENIZER_URL="https://huggingface.co/Qwen/Qwen3.8-27B/resolve/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0/tokenizer.json?download=true"
          TOKENIZER_SHA="0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3"
          curl -fL --retry 10 --retry-all-errors -o "$TOKENIZER.part" "$TOKENIZER_URL"
          echo "$TOKENIZER_SHA  $TOKENIZER.part" | sha256sum -c -
          mv "$TOKENIZER.part" "$TOKENIZER"

      - name: Run baseline and GDN-state-only decode
        shell: bash
        run: |
          set -euxo pipefail
          PROMPT='Memorize these two facts: codeword is MARBLE-731; 6 boxes times 4 pens minus 7 pens equals 17. Output exactly two lines and nothing else. Line 1: Codeword: MARBLE-731. Line 2: Result: 17 pens.'

          mkdir -p work/context-probe/baseline-k3 work/context-probe/state-only-k3

          python qwen38/bonsai2_prompt_spike.py             --model models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf             --native-lib work/context-probe/libbonsai2_quant.so             --state-lib work/context-probe/libgdn_state.so             --tokenizer-json models/qwen-official/tokenizer.json             --prompt "$PROMPT"             --max-new-tokens 32             --threads 4             --resident-decoder             --no-json-events             --work-dir work/context-probe/baseline-k3             --output work/context-probe/baseline.json

          python qwen38/bonsai2_prompt_spike.py             --model models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf             --native-lib work/context-probe/libbonsai2_quant.so             --state-lib work/context-probe/libgdn_state.so             --tokenizer-json models/qwen-official/tokenizer.json             --prompt "$PROMPT"             --max-new-tokens 32             --threads 4             --resident-decoder             --state-only-decode             --no-json-events             --work-dir work/context-probe/state-only-k3             --output work/context-probe/state-only.json

      - name: Compare context retention
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path("work/context-probe/baseline.json").read_text())
          state = json.loads(Path("work/context-probe/state-only.json").read_text())

          a = base["generated_token_ids"]
          b = state["generated_token_ids"]
          common = 0
          for x, y in zip(a, b):
              if x != y:
                  break
              common += 1

          text = state["generated_text"]
          report = {
              "baseline_text": base["generated_text"],
              "state_only_text": text,
              "baseline_tokens": len(a),
              "state_only_tokens": len(b),
              "common_prefix_tokens": common,
              "first_divergence_index": None if common == min(len(a), len(b)) and len(a) == len(b) else common,
              "prompt_attention_rows_dropped": state["dropped_prompt_attention_rows"],
              "state_only_attention_kv_bytes_end": state["state"]["attention_kv_bytes_f16"],
              "retained_codeword": "MARBLE-731" in text,
              "retained_arithmetic": "17" in text,
              "state_only_stop_reason": state["stop_reason"],
              "state_only_tokens_per_second": state["timing"]["tokens_per_second"],
              "state_only_max_rss_gib": state["max_rss_gib"],
          }
          Path("work/context-probe/comparison.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n"
          )
          print(json.dumps(report, indent=2, ensure_ascii=False))
          print("QWEN38_BONSAI2_GDN_STATE_ONLY_PROBE_PASS")
          PY

      - name: Drop large files
        if: always()
        shell: bash
        run: |
          rm -rf models/bonsai2 models/qwen-official
          rm -f work/context-probe/baseline-k3/decoder64.k3.bin
          rm -f work/context-probe/state-only-k3/decoder64.k3.bin

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-gdn-state-only-probe
          path: |
            work/context-probe/*.json
          if-no-files-found: warn
          retention-days: 30
