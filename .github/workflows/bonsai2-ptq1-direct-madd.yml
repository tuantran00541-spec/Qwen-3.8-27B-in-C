name: Bonsai 2 PTQ1 direct packed madd

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/test_bonsai2_ptq1_direct_madd.c
      - qwen38/test_bonsai2_ptq1_direct_madd_wiring.py
      - qwen38/bonsai2_quant_dot_avx2.c
      - .github/workflows/bonsai2-ptq1-direct-madd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ptq1-direct-madd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile direct packed-madd gate
        shell: bash
        run: |
          set -euxo pipefail
          gcc -O3 -std=c11 -mavx2 -mfma \
            -Werror=implicit-function-declaration \
            qwen38/test_bonsai2_ptq1_direct_madd.c -pthread -lm \
            -o bonsai2-ptq1-direct-madd
      - name: Run direct packed-madd bitwise gate
        shell: bash
        run: ./bonsai2-ptq1-direct-madd
      - name: Require production direct packed-madd wiring
        shell: bash
        run: python qwen38/test_bonsai2_ptq1_direct_madd_wiring.py
