name: Bonsai 2 native attention core

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/test_bonsai2_native_attention_core.py
      - qwen38/bonsai2_quant_runtime.py
      - qwen38/bonsai2_quant_dot_avx2.c
      - qwen38/bonsai2_persistent_pool_portable.c
      - qwen38/attention_core_exact.c
      - qwen38/bonsai2_full64_one_token.py
      - qwen38/bonsai2_two_token.py
      - qwen38/bonsai2_prompt_spike.py
      - .github/workflows/bonsai2-attention-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attention-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/attention-core
          gcc -O3 -std=c11 -mavx2 -mfma -fPIC -shared \
            qwen38/bonsai2_persistent_pool_portable.c \
            -pthread -lm \
            -o work/attention-core/libbonsai2_quant.so
      - name: Run native attention-core bitwise and wiring gate
        shell: bash
        run: |
          set -euxo pipefail
          python qwen38/test_bonsai2_native_attention_core.py \
            --native-lib work/attention-core/libbonsai2_quant.so
