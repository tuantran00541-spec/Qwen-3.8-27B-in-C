name: Bonsai 2 portable pool smoke

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/bonsai2_persistent_pool_portable.c
      - qwen38/bonsai2_quant_dot_avx2.c
      - qwen38/qwen_thread_compat.h
      - .github/workflows/bonsai2-portable-pool-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable pool
        shell: bash
        run: |
          set -euxo pipefail
          gcc -O3 -std=c11 -mavx2 -mfma             -DQWEN_BONSAI2_PORTABLE_POOL_SELFTEST             qwen38/bonsai2_persistent_pool_portable.c             -pthread -lm -o bonsai2-portable-pool
          ./bonsai2-portable-pool

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run Win32 portable pool
        shell: cmd
        run: |
          cl /nologo /O2 /std:c11 /arch:AVX2 /DQWEN_BONSAI2_PORTABLE_POOL_SELFTEST qwen38\bonsai2_persistent_pool_portable.c /Fe:bonsai2-portable-pool.exe
          bonsai2-portable-pool.exe
