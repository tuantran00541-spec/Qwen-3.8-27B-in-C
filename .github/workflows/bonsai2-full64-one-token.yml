name: Bonsai 2 full64 one token

on:
  push:
    branches:
      - test/bonsai2-27b
    paths:
      - qwen38/bonsai2_full64_one_token.py
      - qwen38/bonsai2_quant_runtime.py
      - qwen38/bonsai2_quant_dot_avx2.c
      - qwen38/bonsai2_persistent_pool_portable.c
      - qwen38/qwen_thread_compat.h
      - qwen38/llama_full64_one_token_oracle.cpp
      - qwen38/gguf_stream.py
      - qwen38/gguf_k3_layout.py
      - qwen38/k3_stream.py
      - qwen38/qwen35_gdn_quant_layer_gate.py
      - qwen38/qwen35_full_attn_layer3_gate.py
      - .github/workflows/bonsai2-full64-one-token.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record hardware and disk
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/bonsai2-full64
          {
            uname -a
            lscpu
            free -h
            df -h .
          } | tee work/bonsai2-full64/hardware.txt

      - name: Build portable native Bonsai 2 runtime
        shell: bash
        run: |
          set -euxo pipefail
          gcc -O3 -std=c11 -mavx2 -mfma -fPIC -shared \
            qwen38/bonsai2_persistent_pool_portable.c \
            -pthread -lm \
            -o work/bonsai2-full64/libbonsai2_quant.so
          python -m py_compile \
            qwen38/bonsai2_full64_one_token.py \
            qwen38/bonsai2_quant_runtime.py \
            qwen38/gguf_stream.py \
            qwen38/gguf_k3_layout.py \
            qwen38/k3_stream.py

      - name: Build pinned Prism full64 oracle
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/PrismML-Eng/llama.cpp.git prism-llama
          git -C prism-llama checkout d8f26eec76da6d09bb708bcba51ef64b8cd868a3
          mkdir -p prism-llama/examples/bonsai-full64-oracle
          cp qwen38/llama_full64_one_token_oracle.cpp prism-llama/examples/bonsai-full64-oracle/main.cpp
          cat > prism-llama/examples/bonsai-full64-oracle/CMakeLists.txt <<'EOF'
          add_executable(bonsai-full64-oracle main.cpp)
          target_link_libraries(bonsai-full64-oracle PRIVATE llama)
          target_compile_features(bonsai-full64-oracle PRIVATE cxx_std_17)
          EOF
          printf '\nadd_subdirectory(examples/bonsai-full64-oracle)\n' >> prism-llama/CMakeLists.txt
          cmake -S prism-llama -B prism-llama/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build prism-llama/build --target bonsai-full64-oracle --parallel 4

      - name: Download verified PTQ1_0 GGUF
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p models/bonsai2
          MODEL="models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf"
          URL="https://huggingface.co/prism-ml/Ternary-Bonsai-2-27B-gguf/resolve/6ed5e12bf84b7a63069882c91dd9e9218647d17b/Ternary-Bonsai-2-27B-PTQ1_0.gguf?download=true"
          SHA="53107f530aa52eb00912263ab1ee29bd199261c87cd7b4ad4ca1318c1fe33ee3"
          curl -fL --retry 10 --retry-all-errors -C - -o "$MODEL.part" "$URL"
          echo "$SHA  $MODEL.part" | sha256sum -c -
          mv "$MODEL.part" "$MODEL"
          df -h .

      - name: Capture pinned Prism full64 oracle
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v prism-llama/build/bin/bonsai-full64-oracle \
            models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
            work/bonsai2-full64/prism-full64-oracle.json \
            > work/bonsai2-full64/prism-full64.stdout.txt \
            2> work/bonsai2-full64/prism-full64.stderr.txt
          tail -n 100 work/bonsai2-full64/prism-full64.stderr.txt

      - name: Run full64 native K3 local and free lanes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p work/bonsai2-full64/k3
          /usr/bin/time -v python qwen38/bonsai2_full64_one_token.py \
            --model models/bonsai2/Ternary-Bonsai-2-27B-PTQ1_0.gguf \
            --native-lib work/bonsai2-full64/libbonsai2_quant.so \
            --oracle work/bonsai2-full64/prism-full64-oracle.json \
            --work-dir work/bonsai2-full64/k3 \
            --output work/bonsai2-full64/native-full64-result.json \
            --threads 4 \
            > work/bonsai2-full64/native-full64.stdout.txt \
            2> work/bonsai2-full64/native-full64.stderr.txt
          tail -n 160 work/bonsai2-full64/native-full64.stdout.txt
          cat work/bonsai2-full64/native-full64.stderr.txt

      - name: Drop large files
        if: always()
        shell: bash
        run: |
          rm -rf models/bonsai2 prism-llama
          rm -f work/bonsai2-full64/k3/decoder64.k3.bin
          df -h .

      - name: Upload full64 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonsai2-full64-one-token
          path: |
            work/bonsai2-full64/*.json
            work/bonsai2-full64/*.txt
            work/bonsai2-full64/k3/*.json
          if-no-files-found: warn
          retention-days: 30
